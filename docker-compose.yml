# ==============================================================================
# OENEXA Block Explorer — Standalone Local Stack
# Usage: docker compose up -d --build
# ==============================================================================

version: "3.8"

services:
  oenexa-explorer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oenexa-explorer-standalone
    ports:
      - "3001:80"
    environment:
      - VITE_RPC_URL=${VITE_RPC_URL:-http://localhost:8545}
    restart: unless-stopped
