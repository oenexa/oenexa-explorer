server {
    listen 80;
    server_name localhost;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block public exposure of internal backend Actuator/metrics endpoints
    location /actuator/ {
        return 403;
    }

    location = /metrics {
        return 403;
    }

    # Dedicated JSON-RPC proxy to oenexa-node
    location /rpc {
        rewrite ^/rpc/?(.*)$ /$1 break;
        proxy_pass http://oenexa-node:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Support /explorer/ prefix directly
    location /explorer/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # SPA static asset serving
    location / {
        error_page 405 = @rpc_fallback;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # If an RPC client dispatches POST to the web root, rewrite to / and proxy cleanly to the blockchain node
    location @rpc_fallback {
        rewrite ^(.*)$ / break;
        proxy_pass http://oenexa-node:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
