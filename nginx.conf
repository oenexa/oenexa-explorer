server {
    listen 80;
    server_name localhost;

    # Dedicated JSON-RPC proxy to oenexa-node
    location /rpc {
        rewrite ^/rpc/?(.*)$ /$1 break;
        proxy_pass http://oenexa-node:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA static asset serving
    location / {
        error_page 405 = @rpc_fallback;
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # If an RPC client dispatches POST to the web root, rewrite to / and proxy cleanly to the blockchain node
    location @rpc_fallback {
        rewrite ^(.*)$ / break;
        proxy_pass http://oenexa-node:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
